[project]
name = "orquestrador-360"
version = "0.1.0"
description = "Orquestrador 360 / Jarvis Mode — MAP backend (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "anthropic>=0.34.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "apscheduler>=3.10.4",
    # Real bug found 2026-08-19: this lived under [project.optional-dependencies]
    # (an extra), but Vercel's build (`uv` via pyproject.toml, not requirements.txt
    # despite the comment there) only ever installs the base dependency list — no
    # extras are requested. That meant `from upstash_redis import Redis` always
    # raised ModuleNotFoundError in production, silently caught by storage.py's
    # try/except, so every deploy fell back to ephemeral filesystem storage even
    # once the real Upstash Redis resource was connected. Moved to base deps so
    # it's actually present at runtime.
    "upstash-redis>=1.1.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
