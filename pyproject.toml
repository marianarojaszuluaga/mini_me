[project]
name = "orquestrador-360"
version = "0.1.0"
description = "Orquestrador 360 / Jarvis Mode — MAP backend (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "anthropic>=0.34.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "apscheduler>=3.10.4",
    # Real bug found 2026-08-19: this lived under [project.optional-dependencies]
    # (an extra), but Vercel's build (`uv` via pyproject.toml, not requirements.txt
    # despite the comment there) only ever installs the base dependency list — no
    # extras are requested. That meant `from upstash_redis import Redis` always
    # raised ModuleNotFoundError in production, silently caught by storage.py's
    # try/except, so every deploy fell back to ephemeral filesystem storage even
    # once the real Upstash Redis resource was connected. Moved to base deps so
    # it's actually present at runtime.
    "upstash-redis>=1.1.0",
    # Multi-usuario (2026-09-09): email+password + Google-login JWT auth.
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "google-auth>=2.35.0",
    "pydantic[email]>=2.8.0",
]

[project.optional-dependencies]
# QA-E2E agent (Tarea 3, PLAN-qa-automation.md): Playwright as a *test-only*
# dependency — the package is declared here so `qa_e2e_runner.py` can import
# it, but the actual Chromium browser binary is NOT installed by this
# dependency alone. Deploy/CI environments that want to actually run E2E
# checks must run `playwright install chromium` separately (a ~150MB binary
# download, not something to do implicitly on every `pip install`).
test = [
    "pytest>=8.0.0",
    "playwright>=1.47.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
